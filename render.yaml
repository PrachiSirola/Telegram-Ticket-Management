# Render Blueprint — FREE-TIER DEMO deploy: Postgres + API + static frontend.
# Docs: https://render.com/docs/blueprint-spec
#
# Free-tier notes:
#   - The API spins down after ~15 min idle (~50s cold start). Hit its URL a
#     minute before demoing to warm it up.
#   - Filesystem is ephemeral: uploaded attachments reset on restart. Fine for a demo.
#   - Free Postgres expires 30 days after creation.
#   - No Pre-Deploy step or Shell on free tier, so migrations + seed run in the
#     build command below (both are idempotent, safe to repeat every deploy).
#
# IMPORTANT (multi-org pivot): the Prisma migration history was reset to a
# single fresh `init` migration. An existing Render database created from the
# OLD migrations will fail `prisma migrate deploy`. Delete and recreate the
# ticket-mgmt-db database (free-tier DBs are disposable) before redeploying.
#
# One-time setup after the first deploy (values marked `sync: false`):
#   - API  FRONTEND_URL        = https://ticket-mgmt-web.onrender.com
#   - Web  VITE_API_URL        = https://ticket-mgmt-api.onrender.com  (then redeploy Web)
#   Telegram is configured per organisation in-app (Org Settings), not via env.

databases:
  - name: ticket-mgmt-db
    databaseName: ticket_mgmt
    user: ticket
    plan: free # expires 30 days after creation

services:
  # ---- Backend API (Node) ----
  - type: web
    name: ticket-mgmt-api
    runtime: node
    plan: free
    # migrate + seed folded into build (no Pre-Deploy/Shell on free tier); both idempotent
    # --include=dev: NODE_ENV=production (set below, needed at runtime) would
    # otherwise make npm skip devDependencies — but the build needs tsc, prisma,
    # tsx and the @types/*. Force them in for the build only.
    buildCommand: >-
      npm install --include=dev &&
      npm --workspace backend run prisma:generate &&
      npm --workspace backend run build &&
      npm --workspace backend run prisma:deploy &&
      npm --workspace backend run db:seed
    startCommand: npm --workspace backend run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-mgmt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # set to this app's real deployed frontend URL, e.g. https://ticket-mgmt-web.onrender.com — invite/reset/notification links are built from this
      - key: EMAIL_FROM
        sync: false

  # ---- Frontend (static SPA — always free, served from CDN, no spin-down) ----
  - type: web
    name: ticket-mgmt-web
    runtime: static
    buildCommand: npm install --include=dev && npm --workspace frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the API URL; baked in at build time
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # SPA fallback