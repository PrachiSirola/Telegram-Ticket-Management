<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Matches the app's gradient-brand token: linear-gradient(135deg, #c49a6c, #92613a) -->
    <linearGradient id="brand" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c49a6c" />
      <stop offset="1" stop-color="#92613a" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brand)" />
  <text
    x="32"
    y="34"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Plus Jakarta Sans', 'Inter', ui-sans-serif, system-ui, sans-serif"
    font-weight="800"
    font-size="34"
    fill="#ffffff"
  >T</text>
</svg>
